<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无用软件100系列</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    
    .header { text-align: center; padding: 30px 0; }
    .header h1 { 
      font-size: 28px; 
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 14px; opacity: 0.7; margin-top: 8px; }
    .header .count { 
      display: inline-block; 
      background: rgba(255,107,107,0.2); 
      color: #ff6b6b;
      padding: 6px 16px; 
      border-radius: 20px; 
      margin-top: 15px;
      font-size: 13px;
    }
    
    .app-list { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 15px; 
    }
    
    .app-card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .app-card:hover { 
      transform: translateY(-5px); 
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }
    .app-card .icon { font-size: 36px; margin-bottom: 10px; }
    .app-card .name { font-size: 15px; font-weight: bold; margin-bottom: 5px; }
    .app-card .desc { font-size: 12px; opacity: 0.7; }
    .app-card .tag {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      margin-top: 8px;
      background: rgba(72,219,251,0.2);
      color: #48dbfb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 无用软件100系列</h1>
      <p>让AI做的有趣小测试</p>
      <span class="count">第 1 款 / 共 100 款</span>
    </div>
    
    <div class="app-list">
      <a href="apps/dan-nan.html" class="app-card">
        <div class="icon">👫</div>
        <div class="name">脱单难度评估</div>
        <div class="desc">测测你脱单有多难</div>
        <span class="tag">情感测试</span>
      </a>
      
      <a href="#" class="app-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="icon">💼</div>
        <div class="name">工作性价比</div>
        <div class="desc">即将上线</div>
        <span class="tag">敬请期待</span>
      </a>
      
      <a href="#" class="app-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="icon">🐕</div>
        <div class="name">舔狗指数</div>
        <div class="desc">即将上线</div>
        <span class="tag">敬请期待</span>
      </a>
      
      <a href="#" class="app-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="icon">🌙</div>
        <div class="name">熬夜健康度</div>
        <div class="desc">即将上线</div>
        <span class="tag">敬请期待</span>
      </a>
      
      <a href="#" class="app-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="icon">🏃</div>
        <div class="name">运动废柴指数</div>
        <div class="desc">即将上线</div>
        <span class="tag">敬请期待</span>
      </a>
      
      <a href="#" class="app-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="icon">💰</div>
        <div class="name">消费账单分析</div>
        <div class="desc">即将上线</div>
        <span class="tag">敬请期待</span>
      </a>
    </div>
  </div>
</body>
</html>
